<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Printed business product catalogue standing up, with a second copy lying flat">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#fdf8f1"/><stop offset="1" stop-color="#ede4d6"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="205" cy="250" rx="150" ry="24" fill="#000" opacity=".16" filter="url(#soft)"/>
  <!-- flat copy lying behind -->
  <polygon points="232,236 352,166 300,136 180,206" fill="#1c1a18"/>
  <polygon points="232,236 352,166 352,172 232,242" fill="#e8e2d8"/>
  <polygon points="232,236 180,206 180,212 232,242" fill="#d9d2c6"/>
  <g transform="matrix(0.866,-0.5,0.866,0.5,266,186)">
    <text x="0" y="0" font-family="Arial Black, Arial, sans-serif" font-size="12" font-weight="900" fill="#fbf9f4" text-anchor="middle">2026 RANGE</text>
  </g>
  <!-- standing catalogue: page edge -->
  <polygon points="190,252 172,242 172,64 190,74" fill="#efe9df"/>
  <g stroke="#d9d2c6" stroke-width="1">
    <line x1="175" y1="244" x2="175" y2="66"/><line x1="179" y1="246" x2="179" y2="68"/><line x1="183" y1="248" x2="183" y2="70"/><line x1="187" y1="250" x2="187" y2="72"/>
  </g>
  <!-- cover -->
  <polygon points="190,252 300,188 300,10 190,74" fill="#c2410c"/>
  <g transform="matrix(0.866,-0.5,0,1,190,74)">
    <rect x="12" y="18" width="103" height="78" fill="#fbf9f4" opacity=".14"/>
    <polygon points="38,80 64,38 90,80" fill="#fbf9f4" opacity=".9"/>
    <circle cx="86" cy="40" r="10" fill="#f6c453"/>
    <text x="14" y="126" font-family="Arial Black, Arial, sans-serif" font-size="17" font-weight="900" fill="#fbf9f4">PRODUCT</text>
    <text x="14" y="146" font-family="Arial Black, Arial, sans-serif" font-size="17" font-weight="900" fill="#fbf9f4">CATALOGUE</text>
    <text x="14" y="164" font-family="Arial, sans-serif" font-size="8" letter-spacing="2" fill="#fbf9f4" opacity=".85">ACCRA · 2026</text>
  </g>
</svg>
