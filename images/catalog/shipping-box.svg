<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Brown corrugated shipping carton sealed with tape">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#fdf8f1"/><stop offset="1" stop-color="#ede4d6"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <pattern id="flute" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#c79c6b"/><rect width="3" height="6" fill="#bf9362"/></pattern>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="262" rx="125" ry="26" fill="#000" opacity=".16" filter="url(#soft)"/>
  <polygon points="200,270 92,208 92,98 200,160" fill="#a87d4f"/>
  <polygon points="200,270 308,208 308,98 200,160" fill="url(#flute)"/>
  <polygon points="200,160 308,98 200,36 92,98" fill="#d9b88f"/>
  <!-- flap seam -->
  <line x1="146" y1="67" x2="254" y2="129" stroke="#a87d4f" stroke-width="2"/>
  <!-- tape across the seam and down the front -->
  <polygon points="134,70 158,58 266,120 242,134" fill="#e9d3b0" opacity=".85"/>
  <polygon points="242,134 266,120 266,168 242,182" fill="#e3c9a1" opacity=".85"/>
  <!-- shipping label on the right face -->
  <g transform="matrix(0.866,-0.5,0,1,222,192)">
    <rect x="0" y="-26" width="56" height="38" rx="2" fill="#fbf9f4"/>
    <rect x="6" y="-20" width="30" height="4" fill="#1c1a18" opacity=".7"/>
    <rect x="6" y="-12" width="40" height="3" fill="#1c1a18" opacity=".4"/>
    <rect x="6" y="-6" width="34" height="3" fill="#1c1a18" opacity=".4"/>
    <g fill="#1c1a18"><rect x="6" y="2" width="2" height="7"/><rect x="10" y="2" width="1" height="7"/><rect x="13" y="2" width="3" height="7"/><rect x="18" y="2" width="1" height="7"/><rect x="21" y="2" width="2" height="7"/><rect x="25" y="2" width="1" height="7"/><rect x="28" y="2" width="3" height="7"/></g>
  </g>
  <!-- this way up arrows on the left face -->
  <g transform="matrix(0.866,0.5,0,1,116,150)" fill="none" stroke="#5c3d1e" stroke-width="2.5" stroke-linecap="round" opacity=".7">
    <path d="M6 14 V0 M0 6 L6 0 L12 6"/><path d="M22 14 V0 M16 6 L22 0 L28 6"/><path d="M0 20 H28"/>
  </g>
</svg>
