<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Branded thank-you card standing in front of a kraft envelope">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#fdf8f1"/><stop offset="1" stop-color="#ede4d6"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".18"/></filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- kraft envelope behind -->
  <g transform="rotate(-9 230 140)" filter="url(#shadow)">
    <rect x="150" y="58" width="190" height="130" rx="4" fill="#c79c6b"/>
    <path d="M150 58 L245 128 L340 58" fill="none" stroke="#a87d4f" stroke-width="2"/>
    <circle cx="245" cy="128" r="12" fill="#c2410c"/>
    <text x="245" y="132" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#fbf9f4" text-anchor="middle">P</text>
  </g>
  <!-- card -->
  <g transform="rotate(4 170 170)" filter="url(#shadow)">
    <rect x="70" y="96" width="200" height="140" rx="6" fill="#fffdf9"/>
    <rect x="80" y="106" width="180" height="120" rx="3" fill="none" stroke="#e6dfd3"/>
    <!-- textLength keeps the words inside the card whatever font the computer has -->
    <text x="170" y="156" font-family="Brush Script MT, Georgia, cursive" font-size="32" font-style="italic" fill="#c2410c" text-anchor="middle" textLength="128" lengthAdjust="spacingAndGlyphs">Thank you</text>
    <text x="170" y="180" font-family="Arial, sans-serif" font-size="8" fill="#6b635a" text-anchor="middle" textLength="118" lengthAdjust="spacingAndGlyphs">FOR SUPPORTING OUR</text>
    <text x="170" y="192" font-family="Arial, sans-serif" font-size="8" fill="#6b635a" text-anchor="middle" textLength="90" lengthAdjust="spacingAndGlyphs">SMALL BUSINESS</text>
    <g transform="translate(170 210)">
      <path d="M -6 -2 C -6 -8 0 -9 0 -4 C 0 -9 6 -8 6 -2 C 6 3 0 6 0 8 C 0 6 -6 3 -6 -2 Z" fill="#c2410c"/>
    </g>
  </g>
</svg>
